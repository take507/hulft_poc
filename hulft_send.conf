# =============================================================================
# hulft_send.conf  - HULFT送信スクリプト設定ファイル
# =============================================================================

# 同期タイムアウトのデフォルト値（秒）
DEFAULT_TIMEOUT=300

# リトライ回数（初回送信を除く）
RETRY_COUNT=3

# リトライ間隔（秒）
RETRY_INTERVAL=60

# リトライ対象の完了コード（スペース区切りで複数指定可）
# 例: 転送中エラーや一時的な接続失敗コード
RETRY_COMPLETE_CODES="0250 0251"

# リトライ対象の詳細コード（スペース区切りで複数指定可）
# 例: ネットワーク系の一時エラー
RETRY_DETAIL_CODES="0301 0302"
